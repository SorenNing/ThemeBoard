# Legacy CI is disabled. Builds are explicitly dispatched through build.yml.
task:
  only_if: "false"
  name: macOS 构建（App arm64 + 引擎 arm64e）
  macos_instance:
    image: ghcr.io/cirruslabs/macos-sonoma-xcode:latest

  install_script:
    - sw_vers
    - xcodebuild -version
    - xcrun --sdk iphoneos --show-sdk-version

  build_script:
    - bash tools/ci-build.sh

  always:
    binaries_artifacts:
      path: "dist/*.deb"
