name: build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build package
        run: bash tools/ci-build.sh

      - name: Verify final signed packages
        run: python3 tools/verify_carplay_build.py dist build/verification.json

      - name: Upload verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: themeboard-verification
          path: build/verification.json
          if-no-files-found: ignore

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: themeboard-deb
          path: dist/*.deb
          if-no-files-found: error
