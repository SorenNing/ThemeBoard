name: build-linux (unsupported)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsupported:
    # Keep dispatches on the same macOS runner family; do not start a Linux build.
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Explain unsupported Linux and iSH builds
        run: |
          echo '::error::ThemeBoard with original Theseus cannot be built on Linux/iSH: Apple Swift, the iPhoneOS SDK, the Metal compiler and Swift back-deployment runtime require macOS with full Xcode.'
          echo 'Manually run .github/workflows/build.yml, or run sh tools/build-app.sh on macOS. This obsolete Linux entry point intentionally fails and produces no artifacts.'
          exit 1
