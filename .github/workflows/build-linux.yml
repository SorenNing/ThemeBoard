name: build-linux

on:
  push:
    paths:
      - '.github/workflows/build-linux.yml'
      - 'tools/ci-linux-build.sh'
      - 'engine/**'
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git make unzip xz-utils python3 dpkg-dev libtinfo5 || true

      - name: 构建引擎
        run: |
          chmod +x tools/ci-linux-build.sh
          bash tools/ci-linux-build.sh 2>&1 | tee build-linux.log

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-linux
          path: |
            build-linux.log
            dist/*.deb
          if-no-files-found: warn
