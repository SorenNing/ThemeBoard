name: build-linux

on:
  push:
    paths:
      - '.github/workflows/build-linux.yml'
      - 'tools/ci-linux-build.sh'
      - 'engine/**'
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git make unzip xz-utils python3

      - name: 构建（日志落盘 + 诊断）
        run: |
          chmod +x tools/ci-linux-build.sh
          bash tools/ci-linux-build.sh 2>&1 | tee build-linux.log
          echo "exit=$?" >> build-linux.log

      - name: 上传日志与产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            build-linux.log
            out/**
          if-no-files-found: warn